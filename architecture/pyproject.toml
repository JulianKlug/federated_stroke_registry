[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fed-stroke"
version = "0.1.0"
description = "Federated learning for stroke prognostication across GVA and Shenzhen cohorts."
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
    "flwr[simulation]>=1.28.0",
    "flwr-datasets>=0.6.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "pyarrow>=15",
    # Explicit (today only transitive via xgboost/pandas/scikit-learn): the DP
    # plug-point's accountant + learner import them directly and must resolve
    # under `uv sync --no-dev` in the torch-free Shenzhen container (spec 1.1 §2).
    "numpy>=1.26",
    "scipy>=1.11",
]

[tool.hatch.build]
exclude = [".venv", "uv.lock"]

[tool.hatch.build.targets.wheel]
packages = ["fed_stroke"]

[tool.flwr.app]
publisher = "klug"
fab-format-version = 1
flwr-version-target = "1.31.0"

[tool.flwr.app.components]
serverapp = "fed_stroke.server_app:app"
clientapp = "fed_stroke.client_app:app"

[tool.flwr.app.config]
# num-server-rounds is intentionally NOT a config key: it is derived in code
# from `total-trees` per strategy (server_app.derive_num_rounds), so the matched
# tree budget cannot be silently broken by a forgotten flag.
train-method = "bagging"   # "bagging" | "cyclic"
cyclic-order = "forward"   # "forward" | "reverse"; only read when train-method = "cyclic"
total-trees = 40           # final ensemble size; num-server-rounds is DERIVED from this
num-sites = 2              # participating SuperNodes; drives round derivation + min_available_nodes
fraction-train = 1.0
fraction-evaluate = 1.0
local-epochs = 1
save-model = false
model-dir = "out/models"  # where save-model writes final_model.json (relative = ServerApp CWD)

# Evaluation harness (roadmap 1.c)
operating-point = 0.5        # shared FIXED threshold for the cross-site-comparable confusion matrix (§4.1)
metrics-dir = "out/metrics"  # where the per-run site-stratified JSON is written (relative = ServerApp CWD)
n-boot = 1000                # bootstrap resamples for per-metric 95% CIs (§4.1); determinism via boot-seed
boot-seed = 0                # RNG seed for reproducible bootstrap CIs

# Data provenance of the run (spec 1.1.a″ R2/R6; same vocabulary as run_hpo's --data-provenance:
# "example-halves" | "real-frozen-schema"). Gates the DP safety rails: the dp.insecure-test
# noise-seed hatch is REJECTED and the privacy ledger append is REQUIRED when a run declares
# real-frozen-schema data. Runs on real frozen-schema Geneva data MUST override this.
data-provenance = "example-halves"

# HPO split protocol (roadmap 1.1.a; docs/specs/1_1_a_hpo_harness.md §4.5/§4.6).
# All three default to today's FLAT single-split behavior, so an unconfigured run is
# byte-identical to the pre-1.1.a seed-42 split. The HPO harness overrides them per
# run via --run-config. HOLDOUT_PARTITION_SEED is a module constant in task.py (never
# a config key): it must not vary, or the HELD set would shift between search & report.
split-seed = 42       # train/valid split seed; HPO varies it for repeated CV on DEV
holdout-frac = 0.0    # patient-disjoint hold-out fraction; 0.0 = disabled (flat split)
holdout-eval = false  # true only for the winner's hold-out report run: train on DEV, evaluate on HELD

# XGBoost parameters (architecture §3; matched across both strategies)
params.objective = "binary:logistic"
# EXPLICIT base_score (spec 1.1.a″ R7): XGBoost >= 2.0 otherwise auto-derives it from the
# label MEAN, which (a) leaks prevalence outside the DP accounting and (b) un-matches the
# R9 comparator arms' initialization. DP mode fail-closes if this key is absent. Deliberate
# side effect: the non-DP arm now also trains from 0.5 instead of the auto-derived mean.
params.base-score = 0.5
params.seed = 0 # pinned so the 1.d pooled reference trains deterministically (XGBoost default is already 0, so federated numbers are unchanged)
params.eta = 0.1 # Learning rate
params.max-depth = 4
params.min-child-weight = 5
params.eval-metric = "auc"
params.nthread = 16
params.num-parallel-tree = 1
params.subsample = 0.8
params.colsample-bytree = 0.8
params.tree-method = "hist"

# DP plug-point knobs (roadmap Phase v1.1/v1.2 prerequisite; docs/specs/1_1_prereq_dp_plugpoint.md
# §4.3). A SIBLING `dp.*` table, NEVER under `params.*`: XGBoost rejects unknown params, and these
# never reach `xgb.train` — they are consumed by `DPConfig.from_run_config` in `fed_stroke.dp`.
# `dp.enabled = true` forces `subsample = 1.0` inside the DP learner (honest q=1.0 accounting, §3.5);
# the `params.subsample = 0.8` above stays a utility knob for the non-DP arms only.
dp.enabled = false
dp.mechanism = "gaussian"        # "gaussian" (RDP, primary) | "laplace" (secondary basic-composition)
dp.target-epsilon = 5.0          # arch §6.3 starting budget; the {1,3,5,10} sweep is downstream (1.1.b)
dp.delta = 1e-5
dp.clip-bound = 1.0              # geometric leaf clip |w| <= clip_bound (post-processing; ZERO ε effect)
dp.max-bins = 32
dp.bin-strategy = "fixed-range"  # "fixed-range" (data-independent, DP-safe) | "quantile" (NON-DP arms only)
# Append-only cross-run privacy ledger (spec 1.1.a″ R6). Each site appends its authorized
# (k, σ, ε) on the FIRST train call of every real-data DP run (dp.enabled, mechanism not
# identity, data-provenance = "real-frozen-schema"); relative path resolves against the
# SuperNode working directory, so the ledger stays site-local.
dp.ledger-path = "out/dp_ledger.jsonl"

# Secure-topology values, roadmap 1.e (docs/specs/1e_secure_topology.md §4.5/§4.6).
# Deliberately NOT [tool.flwr.federations.*]: `flwr run` migrates that legacy block
# into ~/.flwr/config.toml and then comments it out of this tracked file (spec §3.9).
# run_local_federation.sh materializes [superlink.local-deployment] in
# ~/.flwr/config.toml from this table on every `start`; it and the node map below
# are the single committed source for all ports/addresses/paths.
[tool.fed_stroke.superlink]
name = "local-deployment"
address = "127.0.0.1:9093"        # Control API (what `flwr run`/`flwr supernode register` dial)
fleet-address = "127.0.0.1:9092"  # Fleet API (what SuperNodes pass to --superlink)
ca-cert = "architecture/.secrets/ca.crt"  # repo-relative; resolved to absolute at generation time

[tool.fed_stroke.nodes]
# dp-site-weight (spec 1.1.a″ R5): the FIXED PUBLIC per-site aggregation weight the DP train
# reply sends instead of the exact training count (which is data-dependent under add/remove
# adjacency and not covered by the accountant). Approximate cohort size rounded to hundreds —
# bagging only needs relative weights; exactness buys nothing.
node_A = { data-path = "out/geneva_half_A.parquet", appio = "127.0.0.1:9094", key = "node_A", dp-site-weight = 1000 }
node_B = { data-path = "out/geneva_half_B.parquet", appio = "127.0.0.1:9095", key = "node_B", dp-site-weight = 1000 }

[dependency-groups]
# opacus (pulls torch, ~heavy) is the DP-accountant equivalence-gate reference ONLY
# (docs/specs/1_1_prereq_dp_plugpoint.md §2/§8.8). It MUST NOT enter [project].dependencies
# or the Shenzhen container — dependency-groups are excluded from the built wheel and from
# `uv sync --no-dev`, keeping the federated client runtime torch-free (acceptance §7.6).
dev = ["pytest>=8", "opacus>=1.5,<2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
