[project]
name = "federated-stroke-registry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flwr>=1.15.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "scikit-learn>=1.3",
]

# Two importable packages: `preprocessing` (the shared preprocessing library —
# case ids, cohort filter, first-value extraction, splits, mappings) and
# `registry_alignement` (summary tables / cross-site comparison, imports
# `preprocessing`). Explicit because setuptools flat-layout auto-discovery
# refuses multiple top-level packages.
[tool.setuptools.packages.find]
include = ["preprocessing*", "registry_alignement*"]
